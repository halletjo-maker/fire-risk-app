<!doctype html><html lang="fr"><head><meta charset="utf-8"><style>
@font-face{font-family:Inter;font-weight:400;src:url(../../frontend/node_modules/@fontsource/inter/files/inter-latin-400-normal.woff2)}
@font-face{font-family:Inter;font-weight:600;src:url(../../frontend/node_modules/@fontsource/inter/files/inter-latin-600-normal.woff2)}
@font-face{font-family:Inter;font-weight:700;src:url(../../frontend/node_modules/@fontsource/inter/files/inter-latin-700-normal.woff2)}
@font-face{font-family:Inter;font-weight:800;src:url(../../frontend/node_modules/@fontsource/inter/files/inter-latin-800-normal.woff2)}
*{box-sizing:border-box;margin:0}
html,body{width:1080px;height:1920px;overflow:hidden;background:#0D1117;font-family:Inter,sans-serif;color:#E6EDF3}
.bg{position:absolute;inset:0;background:radial-gradient(900px 700px at 80% 10%,rgba(0,255,136,.10),transparent 60%),radial-gradient(800px 600px at 10% 95%,rgba(232,118,47,.10),transparent 60%)}
.brand{position:absolute;top:70px;left:80px;display:flex;align-items:center;gap:22px;font-weight:800;font-size:44px;color:#E8762F}
.brand svg{width:84px;height:84px}
.prog{position:absolute;left:0;bottom:0;height:12px;background:#00FF88}
.scene{position:absolute;left:80px;right:80px;top:260px;bottom:220px;display:flex;flex-direction:column;justify-content:center;gap:48px;opacity:0}
.el{opacity:0}
.k{font-size:40px;font-weight:700;letter-spacing:4px;text-transform:uppercase;color:#00FF88}
.h{font-size:96px;font-weight:800;line-height:1.08;letter-spacing:-2px}
.m{font-size:58px;font-weight:600;line-height:1.3;color:#C9D1D9}
.s{font-size:44px;line-height:1.4;color:#8B949E}
.big{font-size:330px;font-weight:800;line-height:1;color:#00FF88;letter-spacing:-8px}
.or{color:#E8762F}.gr{color:#00FF88}.rd{color:#F85149}
.card{background:#161B22;border:3px solid #30363D;border-radius:40px;padding:44px 50px}
.row{display:flex;justify-content:space-between;align-items:baseline;font-size:56px;font-weight:600;padding:18px 0;border-bottom:2px solid #21262D}
.row:last-child{border:0}
.row span:first-child{min-width:0}.row span:last-child{white-space:nowrap;margin-left:24px;flex-shrink:0}
.bar{height:56px;border-radius:28px;background:#21262D;overflow:hidden}.fill{height:100%;width:0;background:#00FF88;border-radius:28px}
.tag{display:inline-block;font-size:40px;font-weight:700;padding:14px 30px;border-radius:999px;background:rgba(232,118,47,.15);color:#E8762F}
.foot{position:absolute;left:80px;right:80px;bottom:70px;font-size:30px;color:#6E7681}
.bars{display:flex;flex-direction:column;gap:30px}
.b{display:grid;grid-template-columns:330px 1fr 190px;align-items:center;gap:24px;font-size:44px;font-weight:600}
.b .t{height:64px;border-radius:16px;background:#21262D;overflow:hidden}.b .v{height:100%;border-radius:16px;width:0}
.b .n{text-align:right;font-weight:800}
svg.chart{width:100%;height:560px}
.pill{display:inline-block;font-size:42px;font-weight:700;padding:12px 28px;border-radius:999px;margin-right:16px}
</style></head><body><div class="bg"></div>
